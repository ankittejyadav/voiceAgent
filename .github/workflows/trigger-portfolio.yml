name: Sync Portfolio.md

on:
  push:
    branches:
      - main
    paths:
      - 'portfolio.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Script Executable & Run
        env:
          PORTFOLIO_PAT: ${{ secrets.PORTFOLIO_PAT }}
        run: |
          chmod +x ./scripts/trigger-portfolio.sh
          ./scripts/trigger-portfolio.sh '${{ github.event.repository.name }}'